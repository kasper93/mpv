# Builds and runs the upload replay tests on the hosted macOS runners. Those
# only have Apple's software renderer, which does not show the defect, so
# this only tells that the tests build and run on macOS. macos-15 and
# macos-26 are left out, their jobs got no runner on the fork.
name: apple-gl-upload-test
on:
  workflow_dispatch:
  push:
    branches: [apple-gl-upload-test]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System
        run: |
          sw_vers
          uname -m
      - name: Build
        run: |
          clang -O1 -Wall pbo_upload_test.c -framework OpenGL -o pbo_upload_test
          clang -O1 -Wall pbo_upload_test2.c -framework OpenGL -o pbo_upload_test2
      - name: Second round
        run: ./pbo_upload_test2 || true
      - name: Second round, selftest, every variant has to fail
        run: ./pbo_upload_test2 --selftest --frames=8 || true
      - name: First round
        run: ./pbo_upload_test || true
